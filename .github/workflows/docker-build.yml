name: Build & Publish Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 把 GHCR 镜像包设为公开（源码仓库仍保持私有，魔塔无需凭据即可拉取）
      - name: Make package public
        env:
          GH_TOKEN_GITHUB: "${{ github.token }}"
        run: |
          set -e
          export GH_TOKEN="${GH_TOKEN_GITHUB}"
          for i in 1 2 3 4 5 6; do
            echo "attempt=$i"
            echo "--- 列出容器包 ---"
            gh api -X GET "/user/packages?package_type=container&per_page=100" --jq '.[].name' 2>&1 || true
            echo "--- 尝试 PATCH 设为公开 ---"
            gh api -X PATCH "/user/packages/container/turb-gpt-free-register" -f visibility=public --jq '"visibility="+.visibility' && exit 0
            sleep 15
          done
          echo "FAILED to make public"
          exit 1
